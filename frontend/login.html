<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BillFlow – Login</title>
    <script src="assets/js/api.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        body {
            background: #F5F7FB;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
        }

        .login-card {
            width: 380px;
            padding: 42px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 22px;
            color: #2563EB;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563EB;
            color: white;
            font-weight: 700;
        }

        .subtitle {
            color: #64748B;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .btn-login {
            width: 100%;
            font-weight: 600;
            padding: 10px;
        }

        .error-msg {
            margin-top: 10px;
            color: #DC2626;
            font-size: 13px;
        }

        .loading {
            display: none;
            font-size: 13px;
            color: #64748B;
            margin-top: 10px;
        }
    </style>

</head>

<body>

    <div class="login-card">

        <div class="brand">
            <div class="brand-icon">B</div>
            BillFlow
        </div>

        <div class="subtitle">
            Login to access your billing dashboard
        </div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="user@email.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button class="btn btn-primary btn-login" type="submit">
                Login
            </button>

            <div class="text-center mt-3">
                <span>Don't have an account?</span>
                <a href="register.html" class="register-link">Register</a>
            </div>

            <div id="loading" class="loading">
                Logging in...
            </div>

            <div id="errorMsg" class="error-msg"></div>

        </form>

    </div>

    <script>

        /* redirect if already logged in */

        if (localStorage.getItem("accessToken")) {
            window.location.href = "index.html"
        }

        /* login handler */

        document.getElementById("loginForm").addEventListener("submit", async function (e) {

            e.preventDefault()

            const email = document.getElementById("email").value
            const password = document.getElementById("password").value

            const errorMsg = document.getElementById("errorMsg")
            const loading = document.getElementById("loading")

            errorMsg.textContent = ""
            loading.style.display = "block"

            try {

                const res = await fetch(API_BASE + "/api/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })

                })

                if (!res.ok) {

                    const err = await res.json()

                    throw new Error(err.message || "Login failed")

                }

                const data = await res.json()

                /* store tokens */

                localStorage.setItem("accessToken", data.accessToken)
                localStorage.setItem("refreshToken", data.refreshToken)

                /* redirect */

                window.location.href = "index.html"

            } catch (err) {

                errorMsg.textContent = err.message

            }

            loading.style.display = "none"

        })

    </script>

</body>

</html>
