<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <script src="assets/js/api.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width:350px">

        <h3 class="mb-3">Register</h3>

        <form id="registerForm">

            <input class="form-control mb-3" type="email" id="email" placeholder="Email" required>

            <input class="form-control mb-3" type="password" id="password" placeholder="Password" required>

            <button class="btn btn-primary w-100">Register</button>

        </form>

        <p id="msg" class="mt-3 text-center"></p>

    </div>

    <script>

        const API_BASE = "https://billing-app-o5vw.onrender.com"

        document.getElementById("registerForm").addEventListener("submit", async (e) => {

            e.preventDefault()

            const email = document.getElementById("email").value
            const password = document.getElementById("password").value

            try {

                const res = await fetch(API_BASE + "/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                })

                const data = await res.json()

                if (!res.ok) throw new Error(data.message)

                document.getElementById("msg").innerText = "Registration successful"

            } catch (err) {

                document.getElementById("msg").innerText = err.message

            }

        })

    </script>

</body>

</html>
